reward:
  type: environment
  name: success
  terminal_only: true
  scale: 1.0
  kwargs: {}
algorithm:
  flow_sde: null
  type: grpo
  group_size: 8
  clip_epsilon_low: 0.2
  clip_epsilon_high: 0.2
  kl_coefficient: 0.0
  clip_ratio_c: null
  importance_sampling_level: token
  training_unit: action
  action_advantage_mode: example
  score_source: trajectory_reward
  pad_fixed_horizon_examples: false
  filter_rewards: false
  reward_filter_mode: drop_examples
  rewards_lower_bound: null
  rewards_upper_bound: null
  loss_aggregation: task_balanced_trajectory_mean
  advantage:
    scope: group
    normalize: true
    extra_global_normalization: false
    mask_zero_variance_groups: false
    std_unbiased: true
    epsilon: 1.0e-6
  # Recompute rollout-policy likelihoods with the exact training microbatch
  # geometry. Batched rollout scoring is not numerically interchangeable with
  # the microbatch=1 gradient path for this autoregressive VLA.
  precalculate_logprobs: true
  rollout_logprob_source: recomputed_current_policy
  # Rollout generation is performed in eval mode. Re-score in the same mode so
  # the pre-update importance ratio is one before applying the GRPO gradient.
  logprob_eval_mode: true
  logprob_microbatch_size: 1
  train_logprob_microbatch_size: 1
  pre_update_logprob_kl_tolerance: 0.02
  pre_update_ratio_tolerance: 0.02
  skip_optimizer_step_without_policy_gradient_signal: false
rollout:
  groups_per_update: 120
  epochs_per_update: 1
  workers: 8
  failure_policy: fail_update
  minimum_completed_attempts_per_group: 8
  max_episode_steps: 520
  max_policy_steps: 52
  temperature: 0.2
  deterministic: false
  action_payload:
    kind: token
    require_old_logprobs: true
    require_prompt: true
    require_observation: true
    trainable_action_selection: uniform_grid
    max_trainable_actions_per_trajectory: 4
training:
  updates: 100
  optimizer_steps_per_update: 1
  microbatch_size: 1
  log_action_token_progress: true
  action_token_progress_every_microbatches: 128
  schedule:
    type: full_update
  checkpoint_every_updates: 1
  optimizer:
    type: adamw
    learning_rate: 2.0e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-5
    max_grad_norm: 1.0
evaluation:
  enabled: true
  evaluate_before_training: true
  pre_training_success_gate:
    minimum_success_rate: 0.2
    maximum_success_rate: 0.8
  split: train_matched
  data_role: diagnostic
  runtime: native_lerobot
  # The official revision reports 60% on LIBERO-Long. Stop before GRPO when
