# Development recipe for the first pi0-FAST categorical-token GRPO validation.
# Reproduce the revision-pinned SFT baseline before accepting any RL update.
# One embedded model actor uses each H100; the recipe stays within one node.
schema_version: 1
experiment:
  project: art-embodied-pi0-fast-long
  run: pi0-fast-libero-long-task-balanced-grpo-r32-gpt12-v1
  seed: 20260830
  tags:
    - pi0-fast
    - libero-long
    - grpo
    - categorical-action-tokens
    - lora-r32
    - development
    - one-node
    - exact-old-logprob-rescore
    - autograd-forward-contract
    - detached-alignment-guard
    - explicit-wandb-metric-schema
    - deepthinkvla-lr-oracle
    - lr-only-ablation
    - task-balanced-panel
    - trajectories-960
    - groups-per-task-12
    - task-balanced-loss
    - sft-anchor-b005
    - code-provenance
