    joint_logprob: false
  type: grpo
  group_size: 8
  clip_epsilon_low: 0.2
  clip_epsilon_high: 0.2
  kl_coefficient: 0.0
  clip_ratio_c: 3.0
  importance_sampling_level: token
  training_unit: action
  action_advantage_mode: example
  score_source: trajectory_reward
  pad_fixed_horizon_examples: true
  filter_rewards: true
  reward_filter_mode: loss_mask
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  loss_aggregation: rlinf_chunk_mean
  advantage:
    scope: group
    normalize: true
    extra_global_normalization: false
    mask_zero_variance_groups: false
    std_unbiased: true
    epsilon: 1.0e-06
  precalculate_logprobs: true
  rollout_logprob_source: recomputed_current_policy
  logprob_eval_mode: false
  logprob_microbatch_size: 8
  train_logprob_microbatch_size: 8
  pre_update_logprob_kl_tolerance: 0.02
  pre_update_ratio_tolerance: 0.02
  skip_optimizer_step_without_policy_gradient_signal: false
rollout:
  groups_per_update: 8
  epochs_per_update: 16
  workers: 32
  failure_policy: fail_update
  minimum_completed_attempts_per_group: 8
  max_episode_steps: 520
  max_policy_steps: 52
  temperature: 1.0
  deterministic: false
  action_payload:
    kind: continuous
    require_old_logprobs: true
    require_prompt: false
    require_observation: false
    trainable_action_selection: uniform_grid
    max_trainable_actions_per_trajectory: 32
training:
  updates: 100
  optimizer_steps_per_update: 8
  microbatch_size: 8
  log_action_token_progress: false
  action_token_progress_every_microbatches: 128
  schedule:
    type: rlinf_actor_global_batch
    global_batch_size: 256
    actor_seed: 20260806
    actor_world_size: 8
    rank_local_shuffle: true
    groups_per_process_per_rollout_epoch: 1
    action_chunk_size: 10
    update_epochs: 1
    strict_geometry: false
    pre_update_alignment_guard: first_subupdate
    max_approximate_kl: 0.1
    approximate_kl_guard_scope: primitive_action
    min_optimizer_steps_before_kl_stop: 1
  checkpoint_every_updates: 5
  optimizer:
    type: adamw
    learning_rate: 0.0001
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.95
    epsilon: 1.0e-05
    max_grad_norm: 1.0
evaluation:
